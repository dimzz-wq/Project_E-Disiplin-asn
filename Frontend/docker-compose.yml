version: '3.8'

# ══════════════════════════════════════════════════════════
# E-Disiplin ASN — Docker Compose (Production)
# ══════════════════════════════════════════════════════════
# Cara pakai:
#   1. Salin .env.example → .env dan isi nilainya
#   2. docker compose up -d
#   3. Buka http://localhost:5000
# ══════════════════════════════════════════════════════════

services:

  # ── Database MySQL 8 ──────────────────────────────────
  db:
    image: mysql:8.0
    container_name: edisiplin-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_NAME:-edisiplin_asn}
      MYSQL_USER:          ${DB_USER}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"   # Hanya expose ke localhost
    volumes:
      - db_data:/var/lib/mysql
      - ./server/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Aplikasi (API + Frontend) ─────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    image: edisiplin-asn:latest
    container_name: edisiplin-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT:               5000
      NODE_ENV:           production
      DB_HOST:            db
      DB_PORT:            3306
      DB_USER:            ${DB_USER}
      DB_PASSWORD:        ${DB_PASSWORD}
      DB_NAME:            ${DB_NAME:-edisiplin_asn}
      JWT_SECRET:         ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES:${JWT_REFRESH_EXPIRES:-7d}
      UPLOAD_DIR:         /app/server/uploads
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - uploads_data:/app/server/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
